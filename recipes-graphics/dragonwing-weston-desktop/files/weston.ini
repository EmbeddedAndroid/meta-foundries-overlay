# configuration file for Weston -- Dragonwing desktop branding + kiosk.
# Canonical (Yocto) variant: assets are baked into the read-only /usr rootfs.
# (The live-hotfix variant on a running ostree device uses /etc + /opt paths;
# see DEPLOY.md.)

[core]
idle-time=0
xwayland=true
backend=drm-backend.so
require-input=false
repaint-window=10
require-outputs=none

[shell]
# Desktop wallpaper. Shows whenever no client is fullscreen.
background-image=/usr/share/dragonwing/dragonwing-wallpaper.png
background-type=scale-crop
background-color=0xff06060e

[screen-share]
command=/usr/bin/weston --backend=rdp-backend.so --shell=fullscreen-shell.so --no-resizeable

# Panel launchers, in display order (left to right). Marketplace kiosk first.
# There is no Close launcher: the kiosk app provides its own exit (closing the
# Chromium window stops its container). `dragonwing-kiosk-stop` remains as an
# SSH/CLI helper if you need to kill the container by hand.
#
# `displayname` is the hover caption (weston-desktop-shell supports it). Keep
# `path` space-free: weston splits the path on whitespace, so a spaced path
# would not launch.
[launcher]
icon=/usr/share/dragonwing/icons/kiosk-marketplace.png
path=/usr/bin/dragonwing-kiosk-start
displayname=Dragonwing Experience

# Stock terminal launcher (optional -- drop if you want a cleaner panel).
[launcher]
icon=/usr/share/weston/terminal.png
path=/usr/bin/weston-terminal

# NOTE: the stock Qualcomm "Qdemo" launcher is intentionally omitted.
