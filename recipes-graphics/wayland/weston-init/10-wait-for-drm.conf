# VENTUNO Q / qcom modular graphics: msm DRM, gpucc and dispcc are kernel
# modules that bind late via deferred probe. Without ordering, weston.service
# starts before /dev/dri/card0 exists; with require-outputs=false it then
# comes up headless and never drives the display (text console stays on HDMI).
# Order the compositor after the primary DRM device, and block briefly for the
# deferred-probe window as belt-and-suspenders.
[Unit]
After=dev-dri-card0.device
Wants=dev-dri-card0.device

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do [ -e /dev/dri/card0 ] && exit 0; sleep 0.5; done'
