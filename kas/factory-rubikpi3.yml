# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json
#
# Thundercomm RUBIK Pi 3 variant of the agentic factory. Builds
# lmp-factory-image-rubikpi3 against meta-qcom + meta-qcom-distro +
# meta-qcom-3rdparty + meta-foundries.
#
# Produces a qcomflash tarball at
#   tmp/deploy/images/qcs6490-thundercomm-rubikpi3/lmp-factory-image-rubikpi3-*.qcomflash.tar.gz
#
# The RUBIK Pi 3 BSP arrived in meta-qcom-3rdparty via
# qualcomm-linux/meta-qcom-3rdparty PR #41 (firmware-qcom-boot-rubikpi3
# + machine.conf + packagegroup); the dragonwing marketplace stack +
# fastrpc/wifi/BT/lt9611 kernel patches sitting on top of that come
# from EmbeddedAndroid/meta-qcom-3rdparty:uno-q-next and from this
# overlay's dynamic-layers/qcom/recipes-{extended,kernel}.

header:
  version: 14
  includes:
    - repo: meta-foundries
      file: kas/ci/target-rubikpi3.yml

repos:
  meta-foundries:
    url: https://github.com/EmbeddedAndroid/meta-foundries
    branch: main
    commit: 78e23d864a5417dc5a4cf4ba7560cb2a4808982c

  meta-foundries-overlay:

  meta-updater:
    url: https://github.com/EmbeddedAndroid/meta-updater
    branch: fio-v2

  meta-qcom:
    url: https://github.com/EmbeddedAndroid/meta-qcom
    branch: fio-v2

  meta-qcom-distro:
    url: https://github.com/EmbeddedAndroid/meta-qcom-distro
    branch: fio-v2

  meta-qcom-3rdparty:
    url: https://github.com/EmbeddedAndroid/meta-qcom-3rdparty
    # uno-q-next holds PR #28 (EDK2 + linux-qcom-next for uno-q) plus
    # PR #41 (RUBIK Pi 3 BSP) cherry-picked on top. The name is
    # historical; the branch carries everything we're pinning in the
    # main-next matrix until both PRs merge upstream.
    branch: uno-q-next
    commit: acf4347b122a784f02b7e7cd1bf46767623cb96b

local_conf_header:
  spdx-off: |
    INHERIT:remove = "create-spdx"
    INHERIT_DISTRO:remove = "create-spdx"
  bbmask: |
    # Mask the other 3 image recipes so they do not get parsed for the rubikpi3
    # build. Each image .bb requires layers not in the rubikpi3 kas set
    # (e.g. qcom-console-image.bb lives in meta-qcom-distro; for rubikpi3
    # without that, the require would ParseError).
    BBMASK += "recipes-samples/images/lmp-factory-image\.bb$"
    BBMASK += "recipes-samples/images/lmp-factory-image-ventuno\.bb$"
    BBMASK += "recipes-samples/images/lmp-factory-image-intel\.bb$"
    BBMASK += "recipes-samples/images/lmp-factory-image-unoq\.bb$"
    BBMASK += "recipes-samples/images/lmp-factory-image-iq9075\.bb$"
target:
  - lmp-factory-image-rubikpi3
