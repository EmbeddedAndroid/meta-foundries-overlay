# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json
#
# Arduino UNO Q variant of the agentic factory. Builds
# lmp-factory-image-unoq against meta-qcom + meta-qcom-distro +
# meta-qcom-3rdparty + meta-foundries.
#
# Produces a qcomflash tarball at
#   tmp/deploy/images/uno-q/lmp-factory-image-unoq-*.qcomflash.tar.gz
#
# In-flight UNO Q BSP fixes that haven't landed on meta-qcom-3rdparty
# fio-v1 yet should be added as overlay bbappends under this layer,
# not patched into the BSP fork. Once stabilized, they graduate to
# meta-qcom-3rdparty:fio-v1.

header:
  version: 14
  includes:
    - repo: meta-foundries
      file: kas/ci/target-unoq.yml

repos:
  meta-foundries:
    url: https://github.com/EmbeddedAndroid/meta-foundries
    branch: main
    commit: 63a14e4e5b1f290cea0bb5a0f3e5bac64023ac68

  meta-foundries-overlay:

  meta-updater:
    url: https://github.com/EmbeddedAndroid/meta-updater
    branch: fio-v2

  meta-qcom:
    url: https://github.com/EmbeddedAndroid/meta-qcom
    branch: fio-v2

  meta-qcom-distro:
    url: https://github.com/EmbeddedAndroid/meta-qcom-distro
    branch: fio-v2

  meta-qcom-3rdparty:
    url: https://github.com/EmbeddedAndroid/meta-qcom-3rdparty
    # uno-q-next = upstream main + qualcomm-linux/meta-qcom-3rdparty PR #28
    # (edk2-based boot firmware + linux-qcom-next switch + anx7625 essential).
    # The networkmanager meta-package now arrives via qcom-console-image
    # (lmp-factory-image-unoq's new base); no machine-level override needed.
    # Rebase or drop the branch when #28 merges upstream.
    branch: uno-q-next
    commit: 51c01815efbc8fd557fc7f327ea1a45c9edfef49

local_conf_header:
  spdx-off: |
    INHERIT:remove = "create-spdx"
    INHERIT_DISTRO:remove = "create-spdx"
  bbmask: |
    # Overlay ships three image recipes (qcom rb3gen2, intel, uno-q);
    # bitbake parses all .bb in BBFILES. Mask the non-UNO Q ones so
    # they don't get parsed and don't show up in `bitbake-layers
    # show-recipes`.
    BBMASK += "recipes-samples/images/lmp-factory-image\.bb$"
    BBMASK += "recipes-samples/images/lmp-factory-image-intel\.bb$"

target:
  - lmp-factory-image-unoq
