# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json
#
# Intel x86_64 variant of the agentic factory. Builds
# lmp-factory-image-intel against meta-intel + meta-foundries.
#
# Produces a flashable wic image at
#   tmp/deploy/images/intel-corei7-64/lmp-factory-image-intel-*.wic.gz

header:
  version: 14
  includes:
    - repo: meta-foundries
      file: kas/ci/target-intel-x86.yml

repos:
  meta-foundries:
    url: https://github.com/EmbeddedAndroid/meta-foundries
    branch: main
    commit: 53ad9ad6d442166816714c687eeca9df9067688a

  meta-foundries-overlay:

  meta-updater:
    url: https://github.com/EmbeddedAndroid/meta-updater
    branch: fio-v2

local_conf_header:
  bbmask: |
    # Mask the other 3 image recipes so they do not get parsed for the intel
    # build. Each image .bb requires layers not in the intel kas set
    # (e.g. qcom-console-image.bb lives in meta-qcom-distro; for intel
    # without that, the require would ParseError).
    BBMASK += "recipes-samples/images/lmp-factory-image\.bb$"
    BBMASK += "recipes-samples/images/lmp-factory-image-unoq\.bb$"
    BBMASK += "recipes-samples/images/lmp-factory-image-rubikpi3\.bb$"

  spdx-off: |
    INHERIT:remove = "create-spdx"
    INHERIT_DISTRO:remove = "create-spdx"

target:
  - lmp-factory-image-intel
