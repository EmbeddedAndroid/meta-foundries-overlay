# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# dynamic-layers/<collection>/ holds bbappends that only apply when
# their named layer collection is present in the build. Without this
# gating, an append to e.g. linux-qcom-next would fail at parse time
# for factory configs that don't pull in meta-qcom (intel, etc.).
BBFILES_DYNAMIC += " \
    qcom:${LAYERDIR}/dynamic-layers/qcom/recipes-*/*/*.bb \
    qcom:${LAYERDIR}/dynamic-layers/qcom/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-foundries-overlay"
BBFILE_PATTERN_meta-foundries-overlay = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-foundries-overlay = "31"

LAYERDEPENDS_meta-foundries-overlay = "meta-foundries"
LAYERSERIES_COMPAT_meta-foundries-overlay = "wrynose"
