# Runtime state dirs for the Dragonwing marketplace.
#
# /var/lib/dragonwing-feeds holds the live-preview JPEG each app writes
# (e.g. cam-detect.jpg) for the marketplace UI. The app CONTAINERS run as
# `docker --user 1000:1000`, while the marketplace service (root) only reads
# the dir -- so it must be writable by uid 1000 or the container's imwrite()
# fails with EACCES and no preview is produced. Own it 1000:1000.
#
# ostree /var is stateful (a baked dir's ownership is not reliably carried),
# so create + enforce ownership here via tmpfiles rather than at do_rootfs.
d /var/lib/dragonwing-feeds 0775 1000 1000 -
d /var/lib/dragonwing-sessions 0755 root root -
