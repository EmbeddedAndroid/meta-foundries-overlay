# Seed root's home with the Dragonwing trees on first boot.
# On the ostree distro /root -> /var/roothome is stateful and empty at first
# boot, so the image-baked runtime (installed read-only under
# /usr/share/dragonwing) is copied into /root here. "C" copies only when the
# destination does not yet exist, preserving runtime edits across reboots/OTA.
C /root/marketplace 0755 root root - /usr/share/dragonwing/marketplace
C /root/apps        0755 root root - /usr/share/dragonwing/apps
C /root/qai-export  0755 root root - /usr/share/dragonwing/qai-export
C /root/cam-test    0755 root root - /usr/share/dragonwing/cam-test
